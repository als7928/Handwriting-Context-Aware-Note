apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk047-myservice-frontend
  namespace: class-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk047-myservice-frontend
  template:
    metadata:
      labels:
        app: sk047-myservice-frontend
    spec:
      containers:
        - name: frontend
          image: amdp-registry.skala-ai.com/skala26a-ai2/sk047-myservice-frontend:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: nginx-config
          configMap:
            name: sk047-myservice-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: sk047-myservice-frontend
  namespace: class-2
spec:
  selector:
    app: sk047-myservice-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
