apiVersion: v1
kind: ConfigMap
metadata:
  name: sk047-myservice-backend-config
  namespace: class-2
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  QDRANT_HOST: sk047-myservice-qdrant
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: spatial_chunks
  REQUIRE_QDRANT_ON_STARTUP: "true"
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIM: "1536"
  LLM_MODEL: gpt-4o-mini
  UPLOAD_DIR: /app/uploads
  LOG_FILE: /app/logs/app.log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sk047-myservice-frontend-nginx
  namespace: class-2
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        types {
            application/javascript  js mjs;
            text/css                css;
            text/html               html htm;
            image/svg+xml           svg svgz;
            image/png               png;
            image/jpeg              jpg jpeg;
            application/json        json;
            font/woff               woff;
            font/woff2              woff2;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass         http://sk047-myservice-backend:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 200m;
        }
    }
