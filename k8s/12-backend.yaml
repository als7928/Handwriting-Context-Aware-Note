apiVersion: apps/v1
kind: Deployment
metadata:
  name: sk047-myservice-backend
  namespace: class-2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sk047-myservice-backend
  template:
    metadata:
      labels:
        app: sk047-myservice-backend
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: sk047-myservice-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: sk047-myservice-secret
                  key: POSTGRES_PORT
          command:
            - sh
            - -c
            - |
              until nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
                echo "waiting for postgres";
                sleep 3;
              done
              until nc -z sk047-myservice-qdrant 6333; do
                echo "waiting for qdrant";
                sleep 3;
              done
      containers:
        - name: backend
          image: amdp-registry.skala-ai.com/skala26a-ai2/sk047-myservice-backend:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sk047-myservice-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sk047-myservice-secret
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sk047-myservice-secret
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
            - name: logs-data
              mountPath: /app/logs
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60   # 30 + 60*10 = 630s (~10분) 허용
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: sk047-myservice-uploads-pvc
        - name: logs-data
          persistentVolumeClaim:
            claimName: sk047-myservice-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sk047-myservice-backend
  namespace: class-2
spec:
  selector:
    app: sk047-myservice-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
