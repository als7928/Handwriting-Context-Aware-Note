name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_URL: amdp-registry.skala-ai.com
  HARBOR_PROJECT: skala26a-ai2
  BACKEND_IMAGE: sk047-myservice-backend
  FRONTEND_IMAGE: sk047-myservice-frontend
  K8S_NAMESPACE: class-2
  AWS_REGION: ap-northeast-2

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   HARBOR_USERNAME   - Harbor robot account username
#   HARBOR_PASSWORD   - Harbor robot account password
#   KUBE_CONFIG       - base64-encoded kubeconfig  (cat ~/.kube/config | base64)
#   POSTGRES_DB       - PostgreSQL database name
#   POSTGRES_USER     - PostgreSQL username
#   POSTGRES_PASSWORD - PostgreSQL password
#   POSTGRES_HOST     - PostgreSQL host (e.g. postgres-1-postgresql.postgres)
#   POSTGRES_PORT     - PostgreSQL port (e.g. 5432)
#   DATABASE_URL      - Full asyncpg URL
#   OPENAI_API_KEY    - OpenAI API key
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Docker 이미지 빌드 & Harbor Push
  # ──────────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: write   # git tag 생성·push 권한
    outputs:
      image-tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 태그 히스토리 fetch (버전 계산에 필요)

      # git 태그 기반으로 patch 버전 자동 증가
      # 태그가 없으면 0.0.1 부터 시작, 있으면 마지막 태그 +0.0.1
      - name: Compute next patch version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=${NEXT}" >> $GITHUB_OUTPUT
          echo ">>> Version: ${LATEST:-none} → ${NEXT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # secrets를 env로 받아야 robot$skala26a-ai2 의 $ 가 셸에서 재확장되지 않음.
      # /tmp/docker-config 에 깨끗한 config.json 작성 후 DOCKER_CONFIG 로 명시적으로 전달.
      # buildx(BuildKit)는 DOCKER_CONFIG 를 직접 참조하므로 이 방식이 가장 안정적.
      - name: Write Harbor auth config
        if: github.ref == 'refs/heads/main'
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "${HARBOR_USER}" "${HARBOR_PASS}" | base64 | tr -d '\n')
          mkdir -p /tmp/docker-config
          printf '{"auths":{"%s":{"auth":"%s"}}}' \
            "${{ env.HARBOR_URL }}" "${AUTH}" > /tmp/docker-config/config.json
          echo ">>> Auth config written"
          echo "    username prefix: $(echo ${HARBOR_USER} | cut -c1-10)..."

      # Backend 빌드 (push는 main 브랜치에서만)
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        env:
          DOCKER_CONFIG: /tmp/docker-config
        with:
          context: ./backend
          file: ./backend/Dockerfile-backend
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE }}:latest
          provenance: false

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        env:
          DOCKER_CONFIG: /tmp/docker-config
        with:
          context: ./frontend
          file: ./frontend/Dockerfile-frontend
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE }}:latest
          provenance: false

      # 이미지 push 성공 후 git 태그 생성 (버전 추적)
      - name: Create and push git tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}
          echo ">>> Tagged: ${{ steps.version.outputs.tag }}"

      - name: Summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "### Images pushed to Harbor" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 2: Kubernetes 배포 (main 브랜치 push 시만 실행)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig via EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}


      # sed로 이미지 태그 직접 교체
      - name: Update image tags
        run: |
          TAG=${{ needs.build-push.outputs.image-tag }}
          sed -i "s|${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE }}:[^ ]*|${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.BACKEND_IMAGE }}:${TAG}|g" k8s/12-backend.yaml
          sed -i "s|${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE }}:[^ ]*|${{ env.HARBOR_URL }}/${{ env.HARBOR_PROJECT }}/${{ env.FRONTEND_IMAGE }}:${TAG}|g" k8s/13-frontend.yaml
          echo ">>> Backend image:" && grep "image:" k8s/12-backend.yaml
          echo ">>> Frontend image:" && grep "image:" k8s/13-frontend.yaml

      # Secret을 먼저 생성/업데이트 (pod 기동 전에 실제 값이 있어야 함)
      - name: Create / Update K8s Secret
        env:
          SECRET_POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SECRET_POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          SECRET_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SECRET_POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          SECRET_POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          kubectl create secret generic sk047-myservice-secret \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --from-literal=POSTGRES_DB="${SECRET_POSTGRES_DB}" \
            --from-literal=POSTGRES_USER="${SECRET_POSTGRES_USER}" \
            --from-literal=POSTGRES_PASSWORD="${SECRET_POSTGRES_PASSWORD}" \
            --from-literal=POSTGRES_HOST="${SECRET_POSTGRES_HOST}" \
            --from-literal=POSTGRES_PORT="${SECRET_POSTGRES_PORT}" \
            --from-literal=DATABASE_URL="${SECRET_DATABASE_URL}" \
            --from-literal=OPENAI_API_KEY="${SECRET_OPENAI_API_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -
          # ArgoCD prune으로 secret이 삭제되지 않도록 annotation 추가
          kubectl annotate secret sk047-myservice-secret \
            -n ${{ env.K8S_NAMESPACE }} \
            argocd.argoproj.io/sync-options=Prune=false \
            --overwrite

      # ConfigMap, PVC, Deployment, Service, Ingress 적용 (kustomize 사용)
      - name: Apply K8s manifests
        run: |
          kubectl apply -k k8s/ -n ${{ env.K8S_NAMESPACE }}

      - name: Summary
        run: |
          echo "### Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.K8S_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ needs.build-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} --no-headers | grep sk047 >> $GITHUB_STEP_SUMMARY || true
