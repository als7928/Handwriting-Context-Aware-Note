apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sk047-build-push-pipeline
  namespace: class-2
spec:
  params:
    - name: git-url
      type: string
      description: "Git repository URL"
    - name: git-revision
      type: string
      default: main
    - name: harbor-url
      type: string
      default: amdp-registry.skala-ai.com
    - name: harbor-project
      type: string
      default: skala26a-ai2
    - name: backend-image
      type: string
      default: sk047-myservice-backend
    - name: backend-ver
      type: string
      default: "1.0.4"
    - name: frontend-image
      type: string
      default: sk047-myservice-frontend
    - name: frontend-ver
      type: string
      default: "1.0.1"

  workspaces:
    - name: shared-workspace
    - name: docker-config

  tasks:
    # Stage 1: Checkout
    - name: checkout
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
        - name: deleteExisting
          value: "true"

    # Stage 2: Build & Push Backend (harbor-login 포함)
    - name: build-push-backend
      taskRef:
        name: sk047-kaniko-build-push
      runAfter:
        - checkout
      params:
        - name: image
          value: $(params.harbor-url)/$(params.harbor-project)/$(params.backend-image):$(params.backend-ver)
        - name: dockerfile
          value: backend/Dockerfile-backend
        - name: context
          value: backend
        - name: harbor-url
          value: $(params.harbor-url)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: docker-config
          workspace: docker-config

    # Stage 2: Build & Push Frontend (harbor-login 포함, 병렬 실행)
    - name: build-push-frontend
      taskRef:
        name: sk047-kaniko-build-push
      runAfter:
        - checkout
      params:
        - name: image
          value: $(params.harbor-url)/$(params.harbor-project)/$(params.frontend-image):$(params.frontend-ver)
        - name: dockerfile
          value: frontend/Dockerfile-frontend
        - name: context
          value: frontend
        - name: harbor-url
          value: $(params.harbor-url)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: docker-config
          workspace: docker-config
