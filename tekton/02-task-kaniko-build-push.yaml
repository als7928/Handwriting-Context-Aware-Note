apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sk047-kaniko-build-push
  namespace: class-2
spec:
  params:
    - name: image
      type: string
      description: "Full image name with tag"
    - name: dockerfile
      type: string
      description: "Path to Dockerfile relative to source workspace root"
    - name: context
      type: string
      description: "Build context directory relative to source workspace root"
    - name: harbor-url
      type: string
      default: amdp-registry.skala-ai.com
  workspaces:
    - name: source
      description: "Workspace containing cloned source code"
    - name: docker-config
      description: "emptyDir shared between steps in this pod"
  steps:
    - name: harbor-login
      image: alpine:3.20
      env:
        - name: HARBOR_USERNAME
          valueFrom:
            secretKeyRef:
              name: harbor-robot-account
              key: username
        - name: HARBOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-robot-account
              key: password
      script: |
        #!/bin/sh
        set -e
        AUTH=$(echo -n "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')
        mkdir -p $(workspaces.docker-config.path)
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$(params.harbor-url)" "${AUTH}" \
          > $(workspaces.docker-config.path)/config.json
        echo ">>> Harbor login config created"

    - name: build-push
      image: gcr.io/kaniko-project/executor:latest
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.docker-config.path)
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.dockerfile)
        - --context=dir://$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --verbosity=info
